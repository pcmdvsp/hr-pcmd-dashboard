[functions.admin-set-password]
# Password management is sensitive: the Supabase gateway must reject callers
# without a valid signed-in user JWT before this Function starts.
verify_jwt = true

[functions.send-push-notification]
verify_jwt = true

[functions.meeting-push-notification]
verify_jwt = true

[functions.send-meeting-reminders]
verify_jwt = false

[functions.meeting-reminder-action]
verify_jwt = false
